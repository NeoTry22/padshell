name: PadShell
options:
  bundleIdPrefix: com.gemhelper
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "2"          # 仅 iPad
    CODE_SIGN_STYLE: Manual
targets:
  PadShell:
    type: application
    platform: iOS
    deploymentTarget: "27.0"             # ScreenCaptureKit iOS 平台要求 27.0+
    sources:
      - path: Sources/App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gemhelper.padshell
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: ""
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: PadShell
        NSScreenCaptureUsageDescription: PadShell 需要捕获屏幕画面以联动 ESP32 控制器
        UIBackgroundModes:
          - screen-capture
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    scheme: {}
