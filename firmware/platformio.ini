; ESP32-S3-DevKitC-1 N16R8 (16MB Flash / 8MB OPI PSRAM) - iPad 无人值守远控
[env:esp32s3]
; pioarduino 官方 55.x = Arduino-ESP32 3.3.x，IPv4/IPv6 双栈支持完善
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; N16R8: Flash 为 QIO，PSRAM 为 OPI，必须指定 memory_type 才能正确启用 8MB OPI PSRAM
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    ; NimBLE 2.x 适配 Arduino-ESP32 3.x；纯 NimBLE 栈，禁用 Bluedroid
    h2zero/NimBLE-Arduino@^2.2.0
